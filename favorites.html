<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMASCORE — Favoris</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #0a0e1a; color: #fff; min-height: 100vh; padding-bottom: 80px; }

    .header {
      background: #0f1923; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid #1a2a2a;
    }
    .header-title { font-size: 18px; font-weight: 900; color: #fff; }
    .header-count {
      background: #f0c000; color: #0a0e1a;
      font-size: 11px; font-weight: 800;
      padding: 3px 10px; border-radius: 99px;
    }

    .empty-state {
      text-align: center; padding: 60px 20px;
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .empty-sub { font-size: 13px; color: #556; }
    .empty-btn {
      display: inline-block; margin-top: 20px;
      background: #5DBE74; color: #0a0e1a;
      font-size: 13px; font-weight: 700;
      padding: 10px 24px; border-radius: 99px;
      text-decoration: none;
    }

    .sec-lbl { font-size: 10px; font-weight: 800; color: #556; letter-spacing: 2px; padding: 16px 16px 8px; }

    .match-card {
      background: #0f1923; margin: 0 12px 10px;
      border-radius: 14px; border: 1px solid #1a2a2a;
      overflow: hidden; cursor: pointer; transition: border-color 0.2s;
    }
    .match-card:hover { border-color: #2a4a2a; }
    .match-card:active { opacity: 0.85; }
    .mc-top { padding: 8px 14px 6px; display: flex; align-items: center; justify-content: space-between; }
    .mc-league { font-size: 10px; color: #556; font-weight: 600; }
    .mc-time { font-size: 10px; color: #5DBE74; font-weight: 700; background: #0d2016; padding: 2px 8px; border-radius: 99px; border: 1px solid #1a3a1a; }
    .mc-live { font-size: 10px; color: #e84545; font-weight: 700; background: #2a0a0a; padding: 2px 8px; border-radius: 99px; }
    .match-teams { padding: 4px 14px 10px; display: flex; align-items: center; justify-content: space-between; }
    .mt { font-size: 14px; font-weight: 700; color: #fff; flex: 1; }
    .mt.r { text-align: right; }
    .mt-vs { font-size: 11px; color: #2a3a2a; padding: 0 10px; font-weight: 700; }
    .match-odds { display: flex; border-top: 1px solid #1a2a2a; }
    .odd { flex: 1; padding: 8px 0; text-align: center; border-right: 1px solid #1a2a2a; }
    .odd:last-child { border-right: none; }
    .odd-label { font-size: 9px; color: #556; display: block; font-weight: 700; margin-bottom: 2px; }
    .odd-val { font-size: 13px; font-weight: 800; color: #aaa; }
    .odd.best .odd-val { color: #5DBE74; }
    .odd.best .odd-label { color: #5DBE74; }
    .match-footer { padding: 8px 14px; display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid #1a2a2a; }
    .mkt-tag { font-size: 9px; padding: 3px 8px; border-radius: 99px; background: #1a2a2a; color: #556; font-weight: 600; }
    .mkt-tag.hot { background: #0d2016; color: #5DBE74; border: 1px solid #1a3a1a; }
    .remove-btn {
      font-size: 9px; padding: 3px 8px; border-radius: 99px;
      background: #2a0a0a; color: #e84545;
      border: 1px solid #3a1a1a; font-weight: 600;
      cursor: pointer;
    }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0f1923; border-top: 1px solid #1a2a2a; display: flex; z-index: 100; }
    .bnav { flex: 1; padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; cursor: pointer; transition: transform 0.2s; }
    .bnav:active { transform: scale(0.85); }
    .bnav-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
    .bnav-icon svg { width: 22px; height: 22px; }
    .bnav-lbl { font-size: 9px; font-weight: 700; color: #556; letter-spacing: 0.5px; }
    .bnav.active .bnav-lbl { color: #5DBE74; }
    svg path, svg rect, svg circle, svg polygon { fill: #556; }
    .bnav.active svg path, .bnav.active svg rect, .bnav.active svg circle { fill: #5DBE74; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 28px; height: 28px; border: 3px solid #1a2a2a; border-top-color: #5DBE74; border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">⭐ Mes Favoris</div>
    <div class="header-count" id="favCount">0</div>
  </div>

  <div id="favContainer"><div class="spinner"></div></div>

  <nav class="bottom-nav">
    <a href="home.html" class="bnav"><div class="bnav-icon"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div><span class="bnav-lbl">Accueil</span></a>
    <a href="matches.html" class="bnav"><div class="bnav-icon"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg></div><span class="bnav-lbl">Matchs</span></a>
    <a href="favorites.html" class="bnav active"><div class="bnav-icon"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div><span class="bnav-lbl">Favoris</span></a>
    <a href="account.html" class="bnav"><div class="bnav-icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div><span class="bnav-lbl">Compte</span></a>
  </nav>

  <script>
    function goToMatch(home, away, league, time, homeId, awayId) {
      window.location.href = 'match.html?home=' + encodeURIComponent(home) + '&away=' + encodeURIComponent(away) + '&league=' + encodeURIComponent(league) + '&time=' + encodeURIComponent(time) + '&homeId=' + (homeId||0) + '&awayId=' + (awayId||0);
    }

    function removeFav(id, el) {
      var favs = JSON.parse(localStorage.getItem('ema_favorites') || '[]');
      var savedMatches = JSON.parse(localStorage.getItem('ema_fav_matches') || '[]');
      favs = favs.filter(function(f) { return f != id; });
      savedMatches = savedMatches.filter(function(m) { return m.id != id; });
      localStorage.setItem('ema_favorites', JSON.stringify(favs));
      localStorage.setItem('ema_fav_matches', JSON.stringify(savedMatches));
      var card = el.closest('.match-card');
      card.style.transition = 'opacity 0.3s, transform 0.3s';
      card.style.opacity = '0';
      card.style.transform = 'translateX(100%)';
      setTimeout(function() { card.remove(); renderCount(); }, 300);
    }

    function renderCount() {
      var favs = JSON.parse(localStorage.getItem('ema_favorites') || '[]');
      document.getElementById('favCount').textContent = favs.length;
      if (favs.length === 0) {
        document.getElementById('favContainer').innerHTML = '<div class="empty-state"><div class="empty-icon">⭐</div><div class="empty-title">Aucun favori</div><div class="empty-sub">Ajoute des matchs depuis les championnats</div><a href="home.html" class="empty-btn">Explorer les matchs</a></div>';
      }
    }

    function loadFavorites() {
      var savedMatches = JSON.parse(localStorage.getItem('ema_fav_matches') || '[]');
      var favs = JSON.parse(localStorage.getItem('ema_favorites') || '[]');
      document.getElementById('favCount').textContent = favs.length;

      if (!savedMatches.length) {
        document.getElementById('favContainer').innerHTML = '<div class="empty-state"><div class="empty-icon">⭐</div><div class="empty-title">Aucun favori</div><div class="empty-sub">Ajoute des matchs depuis les championnats</div><a href="home.html" class="empty-btn">Explorer les matchs</a></div>';
        return;
      }

      var html = '<div class="sec-lbl">MES MATCHS FAVORIS</div>';
      for (var i = 0; i < savedMatches.length; i++) {
        var m = savedMatches[i];
        var home = m.homeTeam && m.homeTeam.shortName ? m.homeTeam.shortName : (m.homeTeam && m.homeTeam.name ? m.homeTeam.name : 'Domicile');
        var away = m.awayTeam && m.awayTeam.shortName ? m.awayTeam.shortName : (m.awayTeam && m.awayTeam.name ? m.awayTeam.name : 'Extérieur');
        var homeCrest = m.homeTeam && m.homeTeam.crest ? '<img src="'+m.homeTeam.crest+'" style="width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:4px;">' : '';
        var awayCrest = m.awayTeam && m.awayTeam.crest ? '<img src="'+m.awayTeam.crest+'" style="width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:4px;">' : '';
        var homeDisplay = homeCrest + home;
        var awayDisplay = awayCrest + away;
        var league = m.competition && m.competition.name ? m.competition.name : '';
        var leagueCode = m.competition && m.competition.code ? m.competition.code : 'PL';
        var isLive = m.status === 'IN_PLAY' || m.status === 'LIVE';
        var d = new Date(m.utcDate);
        var time = d.toLocaleTimeString('fr', {hour:'2-digit', minute:'2-digit'});
        var date = d.toLocaleDateString('fr', {day:'2-digit', month:'2-digit'});
        var statusHtml = isLive ? '<span class="mc-live">● EN DIRECT</span>' : '<span class="mc-time">' + date + ' · ' + time + '</span>';
        var hId = m.homeTeam && m.homeTeam.id ? m.homeTeam.id : 0;
        var aId = m.awayTeam && m.awayTeam.id ? m.awayTeam.id : 0;
        html += '<div class="match-card" onclick="goToMatch(\'' + home.replace(/'/g,'') + '\',\'' + away.replace(/'/g,'') + '\',\'' + leagueCode + '\',\'' + time + '\',' + hId + ',' + aId + ')">';
        html += '<div class="mc-top"><span class="mc-league">' + league + '</span>' + statusHtml + '</div>';
        html += '<div class="match-teams"><span class="mt">' + homeDisplay + '</span><span class="mt-vs">vs</span><span class="mt r">' + awayDisplay + '</span></div>';
        html += '<div class="match-odds"><div class="odd"><span class="odd-label">1</span><span class="odd-val" id="prob1-'+m.id+'">...</span></div><div class="odd"><span class="odd-label">X</span><span class="odd-val" id="probX-'+m.id+'">...</span></div><div class="odd"><span class="odd-label">2</span><span class="odd-val" id="prob2-'+m.id+'">...</span></div></div>';
        html += '<div class="match-footer"><span class="mkt-tag hot" id="btts-'+m.id+'">BTTS — ...</span><span class="mkt-tag hot" id="over-'+m.id+'">+2.5 — ...</span><span class="remove-btn" onclick="event.stopPropagation();removeFav('+m.id+',this);">✕ Retirer</span></div>';
        html += '</div>';
      }
      document.getElementById('favContainer').innerHTML = html;

      // Vraies probabilités
      for (var j = 0; j < savedMatches.length; j++) {
        (function(match) {
          var hId = match.homeTeam && match.homeTeam.id ? match.homeTeam.id : 0;
          var aId = match.awayTeam && match.awayTeam.id ? match.awayTeam.id : 0;
          var code = match.competition && match.competition.code ? match.competition.code : 'PL';
          if (hId === 0 && aId === 0) return;
          fetch('https://emascore-api.onrender.com/api/probs?home=' + hId + '&away=' + aId + '&league=' + code)
            .then(function(r) { return r.json(); })
            .then(function(p) {
              var el1 = document.getElementById('prob1-' + match.id);
              var elX = document.getElementById('probX-' + match.id);
              var el2 = document.getElementById('prob2-' + match.id);
              var elB = document.getElementById('btts-' + match.id);
              var elO = document.getElementById('over-' + match.id);
              if (el1) el1.textContent = p.prob1 + '%';
              if (elX) elX.textContent = p.probX + '%';
              if (el2) el2.textContent = p.prob2 + '%';
              if (elB) elB.textContent = 'BTTS — ' + p.btts + '%';
              if (elO) elO.textContent = '+2.5 — ' + p.over25 + '%';
              if (el1 && elX && el2) {
                var best = Math.max(p.prob1, p.probX, p.prob2);
                if (p.prob1 === best) el1.closest('.odd').classList.add('best');
                else if (p.probX === best) elX.closest('.odd').classList.add('best');
                else el2.closest('.odd').classList.add('best');
              }
            }).catch(function() {});
        })(savedMatches[j]);
      }
    }

    loadFavorites();
  </script>
</body>
</html>
