<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMASCORE — Connexion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #0f1923;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .header {
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 0.5px solid #1e2e1e;
    }
    .back {
      color: #5DBE74;
      font-size: 22px;
      cursor: pointer;
      text-decoration: none;
    }
    .header-title {
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      flex: 1;
      letter-spacing: 1px;
    }
    .switch-link {
      font-size: 11px;
      color: #5DBE74;
      cursor: pointer;
      text-decoration: none;
    }
    .body {
      padding: 24px 18px 36px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .logo-center {
      text-align: center;
      margin-bottom: 8px;
    }
    .logo-center .logo {
      font-size: 20px;
      font-weight: bold;
      color: #5DBE74;
      letter-spacing: 3px;
    }
    .logo-center .sub {
      font-size: 10px;
      color: #556;
      margin-top: 4px;
    }
    .form-label {
      font-size: 10px;
      font-weight: bold;
      color: #5DBE74;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
      display: block;
    }
    .form-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 8px;
      background: #1a2a1a;
      border: 0.5px solid #2a3a2a;
      color: #ddd;
      font-size: 13px;
      outline: none;
    }
    .form-input:focus {
      border-color: #5DBE74;
    }
    .forgot {
      text-align: right;
      font-size: 11px;
      color: #5DBE74;
      cursor: pointer;
      margin-top: -8px;
    }
    .btn-green {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: #5DBE74;
      border: none;
      color: #0f1923;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .signup-link {
      text-align: center;
      font-size: 11px;
      color: #556;
      line-height: 1.8;
    }
    .signup-link a {
      color: #5DBE74;
      text-decoration: none;
    }
  </style>

<script src="translations.js"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5DBE74">
</head>
<body>

    
    <div class="header">
      <a href="index.html" class="back">←</a>
      <span class="header-title" data-i18n="login_title">CONNEXION</span>
      <a href="register.html" class="switch-link" data-i18n="login_register">S'inscrire</a>
    </div>
    <div class="body">
      <div class="logo-center">
        <div class="logo">EMASCORE</div>
        <div class="sub" data-i18n="login_welcome">Bienvenue</div>
      </div>
      <div>
        <label class="form-label" data-i18n="login_email">ADRESSE E-MAIL</label>
        <input class="form-input" type="email" placeholder="exemple@email.com">
      </div>
      <div>
        <label class="form-label" data-i18n="login_password">MOT DE PASSE</label>
        <div style="position:relative;"><input class="form-input" type="password" placeholder="••••••••" style="padding-right:48px;"><button type="button" onclick="var i=this.previousElementSibling;i.type=i.type==='password'?'text':'password';this.querySelector('svg').style.opacity=i.type==='text'?'1':'0.5';" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5;transition:opacity 0.2s;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>
      </div>
      <div class="forgot" data-i18n="login_forgot">Mot de passe oublié ?</div>
      <button class="btn-green" onclick="login()"><span data-i18n="login_btn">SE CONNECTER</span></button>
      <div class="signup-link">
        <span data-i18n="login_no_account">Pas encore de compte ?</span><br>
        <a href="register.html" data-i18n="login_create">Créer un compte gratuitement</a>
      </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL = "https://zgtilvrlozkurnrwkjvt.supabase.co";
var SUPABASE_KEY = "sb_publishable_T-ufmToZRC3oneHG0gef6Q_wgfhaQ9D";
var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function login() {
  var email = document.querySelector("input[type=email]").value;
  var password = document.querySelector("input[type=password]").value;
  if (!email || !password) { alert("Remplis tous les champs !"); return; }
  var result = await supabase.auth.signInWithPassword({ email: email, password: password });
  if (result.error) { alert("Erreur : " + result.error.message); return; }
  localStorage.setItem("ema_user", JSON.stringify(result.data.user));
  window.location.href = "home.html";
}
</script>
</body>
</html>
