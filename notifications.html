<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMASCORE — Notifications</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #0a0e1a; color: #fff; min-height: 100vh; padding-bottom: 80px; }

    .header {
      background: #0f1923; padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid #1a2a2a;
    }
    .back-btn {
      background: #1a2a2a; border: 1px solid #2a4a2a;
      color: #5DBE74; width: 36px; height: 36px;
      border-radius: 50%; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .header-title { font-size: 16px; font-weight: 800; color: #fff; flex: 1; }
    .header-clear {
      font-size: 11px; font-weight: 700; color: #e84545;
      cursor: pointer; padding: 6px 12px;
      background: #2a0a0a; border-radius: 99px;
      border: 1px solid #3a1a1a;
    }

    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .empty-sub { font-size: 13px; color: #556; }

    .sec-lbl { font-size: 10px; font-weight: 800; color: #556; letter-spacing: 2px; padding: 16px 16px 8px; }

    .notif-card {
      background: #0f1923; margin: 0 12px 8px;
      border-radius: 14px; border: 1px solid #1a2a2a;
      padding: 14px 16px; display: flex; gap: 12px;
      align-items: flex-start; transition: border-color 0.2s;
    }
    .notif-card.unread { border-color: #2a4a2a; background: #0d1a0d; }
    .notif-icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: #1a2a2a; display: flex; align-items: center;
      justify-content: center; font-size: 18px; flex-shrink: 0;
    }
    .notif-icon.green { background: #0d2016; }
    .notif-icon.yellow { background: #2a2000; }
    .notif-icon.red { background: #2a0a0a; }
    .notif-content { flex: 1; }
    .notif-title { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .notif-text { font-size: 11px; color: #556; line-height: 1.4; }
    .notif-time { font-size: 10px; color: #2a3a2a; margin-top: 6px; font-weight: 600; }
    .notif-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #5DBE74; flex-shrink: 0; margin-top: 4px;
    }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0f1923; border-top: 1px solid #1a2a2a; display: flex; z-index: 100; }
    .bnav { flex: 1; padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; cursor: pointer; transition: transform 0.2s; }
    .bnav:active { transform: scale(0.85); }
    .bnav-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
    .bnav-icon svg { width: 22px; height: 22px; }
    .bnav-lbl { font-size: 9px; font-weight: 700; color: #556; letter-spacing: 0.5px; }
    .bnav.active .bnav-lbl { color: #5DBE74; }
    svg path, svg rect, svg circle, svg polygon { fill: #556; }
    .bnav.active svg path, .bnav.active svg rect, .bnav.active svg circle { fill: #5DBE74; }
  </style>
</head>
<body>

  <div class="header">
    <button onclick="window.history.back()" class="back-btn">‹</button>
    <span class="header-title">Notifications</span>
    <span class="header-clear" onclick="clearNotifs()">Tout effacer</span>
  </div>

  <div id="notifsContainer"></div>

  <nav class="bottom-nav">
    <a href="home.html" class="bnav"><div class="bnav-icon"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div><span class="bnav-lbl">Accueil</span></a>
    <a href="matches.html" class="bnav"><div class="bnav-icon"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg></div><span class="bnav-lbl">Matchs</span></a>
    <a href="favorites.html" class="bnav"><div class="bnav-icon"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div><span class="bnav-lbl">Favoris</span></a>
    <a href="account.html" class="bnav active"><div class="bnav-icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div><span class="bnav-lbl">Compte</span></a>
  </nav>

  <script>
    var defaultNotifs = [
      { id: 1, icon: '⚽', type: 'green', title: 'Bienvenue sur EMASCORE !', text: 'Découvrez les meilleurs pronostics pour vos championnats préférés.', time: "Aujourd'hui", unread: true },
      { id: 2, icon: '🏆', type: 'yellow', title: 'Coupe du Monde 2026', text: 'La Coupe du Monde commence le 11 juin 2026. Retrouvez tous les matchs et pronostics.', time: "Aujourd'hui", unread: true },
      { id: 3, icon: '⚡', type: 'green', title: 'Nouveaux matchs disponibles', text: 'La Liga reprend ce week-end avec 10 matchs à venir.', time: 'Il y a 1h', unread: false },
      { id: 4, icon: '📊', type: 'green', title: 'Statistiques mises à jour', text: 'Les probabilités de vos matchs favoris ont été recalculées.', time: 'Il y a 3h', unread: false },
    ];

    function loadNotifs() {
      var notifs = JSON.parse(localStorage.getItem('ema_notifs') || JSON.stringify(defaultNotifs));
      if (!notifs.length) {
        document.getElementById('notifsContainer').innerHTML = '<div class="empty-state"><div class="empty-icon">🔔</div><div class="empty-title">Aucune notification</div><div class="empty-sub">Vous êtes à jour !</div></div>';
        return;
      }
      var html = '<div class="sec-lbl">RÉCENTES</div>';
      notifs.forEach(function(n) {
        html += '<div class="notif-card' + (n.unread ? ' unread' : '') + '">';
        html += '<div class="notif-icon ' + n.type + '">' + n.icon + '</div>';
        html += '<div class="notif-content"><div class="notif-title">' + n.title + '</div><div class="notif-text">' + n.text + '</div><div class="notif-time">' + n.time + '</div></div>';
        if (n.unread) html += '<div class="notif-dot"></div>';
        html += '</div>';
      });
      document.getElementById('notifsContainer').innerHTML = html;
      // Marquer comme lues
      notifs.forEach(function(n) { n.unread = false; });
      localStorage.setItem('ema_notifs', JSON.stringify(notifs));
    }

    function clearNotifs() {
      if (confirm('Effacer toutes les notifications ?')) {
        localStorage.removeItem('ema_notifs');
        document.getElementById('notifsContainer').innerHTML = '<div class="empty-state"><div class="empty-icon">🔔</div><div class="empty-title">Aucune notification</div><div class="empty-sub">Vous êtes à jour !</div></div>';
      }
    }

    loadNotifs();
  </script>
</body>
</html>
