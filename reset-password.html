<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMASCORE — Nouveau mot de passe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0e1a; color:#fff; font-family:'Segoe UI',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.card { width:100%; max-width:360px; padding:0 24px; }
.logo { text-align:center; margin-bottom:32px; }
.logo img { height:48px; }
h2 { font-size:22px; font-weight:800; margin-bottom:8px; text-align:center; }
p { color:#556; font-size:13px; text-align:center; margin-bottom:28px; }
label { display:block; font-size:11px; color:#aaa; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.field { margin-bottom:16px; position:relative; }
input { width:100%; background:#1a2a2a; border:1px solid #2a3a3a; border-radius:8px; padding:12px 50px 12px 16px; color:#fff; font-size:14px; outline:none; }
input:focus { border-color:#5DBE74; }
.eye { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; }
.btn { width:100%; background:#5DBE74; color:#fff; border:none; border-radius:8px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; margin-top:8px; }
.msg { text-align:center; font-size:13px; margin-top:12px; padding:10px; border-radius:8px; display:none; }
.msg.error { background:rgba(232,69,69,0.1); border:1px solid #e84545; color:#e84545; }
.msg.success { background:rgba(93,190,116,0.1); border:1px solid #5DBE74; color:#5DBE74; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="logo.png" alt="EMASCORE"></div>
  <h2>Nouveau mot de passe</h2>
  <p>Choisissez un nouveau mot de passe sécurisé</p>
  <div class="field">
    <label>Nouveau mot de passe</label>
    <input type="password" id="newPass" placeholder="Minimum 6 caractères">
    <button class="eye" type="button" onclick="var i=document.getElementById('newPass');i.type=i.type==='password'?'text':'password';"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <div class="field">
    <label>Confirmer le mot de passe</label>
    <input type="password" id="confirmPass" placeholder="Répétez le mot de passe">
    <button class="eye" type="button" onclick="var i=document.getElementById('confirmPass');i.type=i.type==='password'?'text':'password';"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <button class="btn" onclick="resetPass()">Mettre à jour</button>
  <div class="msg" id="msg"></div>
</div>
<script>
var supabase = window.supabase.createClient(
  'https://zgtilvrlozkurnrwkjvt.supabase.co',
  'sb_publishable_T-ufmToZRC3oneHG0gef6Q_wgfhaQ9D'
);

// Initialiser session depuis le hash
supabase.auth.onAuthStateChange(function(event, session) {
  console.log('Auth event:', event, session);
});

// Extraire token du hash
var hashParams = {};
window.location.hash.substring(1).split('&').forEach(function(p) {
  var parts = p.split('=');
  hashParams[parts[0]] = parts[1];
});
if (hashParams.access_token) {
  supabase.auth.setSession({
    access_token: decodeURIComponent(hashParams.access_token),
    refresh_token: decodeURIComponent(hashParams.refresh_token || '')
  }).then(function(r) { console.log('Session set:', r); });
}

async function resetPass() {
  var newPass = document.getElementById('newPass').value;
  var confirmPass = document.getElementById('confirmPass').value;
  var msg = document.getElementById('msg');
  
  if (!newPass || newPass.length < 6) { showMsg('Le mot de passe doit avoir au moins 6 caractères', 'error'); return; }
  if (newPass !== confirmPass) { showMsg('Les mots de passe ne correspondent pas', 'error'); return; }
  
  try {
    var result = await supabase.auth.updateUser({ password: newPass });
    if (result.error) { showMsg(result.error.message, 'error'); return; }
    showMsg('Mot de passe mis à jour ! Redirection...', 'success');
    setTimeout(function() { window.location.href = 'login.html'; }, 2000);
  } catch(e) {
    showMsg('Erreur. Réessayez.', 'error');
  }
}

function showMsg(text, type) {
  var msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
  msg.style.display = 'block';
}
</script>
</body>
</html>
